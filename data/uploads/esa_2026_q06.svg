<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" width="100%" height="100%" style="background-color: #ffffff; font-family: 'Times New Roman', serif;">
  <!-- Grade horizontal -->
  <line x1="60" y1="260" x2="440" y2="260" stroke="#333" stroke-width="1.5" />
  <line x1="60" y1="230" x2="440" y2="230" stroke="#ccc" stroke-width="0.8" />
  <line x1="60" y1="200" x2="440" y2="200" stroke="#ccc" stroke-width="0.8" />
  <line x1="60" y1="170" x2="440" y2="170" stroke="#ccc" stroke-width="0.8" />
  <line x1="60" y1="140" x2="440" y2="140" stroke="#ccc" stroke-width="0.8" />
  <line x1="60" y1="110" x2="440" y2="110" stroke="#ccc" stroke-width="0.8" />
  <line x1="60" y1="80" x2="440" y2="80" stroke="#ccc" stroke-width="0.8" />
  <line x1="60" y1="50" x2="440" y2="50" stroke="#ccc" stroke-width="0.8" />
  <line x1="60" y1="20" x2="440" y2="20" stroke="#ccc" stroke-width="0.8" />

  <!-- Eixo vertical Y -->
  <line x1="60" y1="260" x2="60" y2="20" stroke="#333" stroke-width="1.5" />
  <!-- Borda direita do gráfico -->
  <line x1="440" y1="260" x2="440" y2="20" stroke="#888" stroke-width="1" />
  <line x1="60" y1="20" x2="440" y2="20" stroke="#888" stroke-width="1" />

  <!-- Rótulos do eixo Y (número de alunos 0 a 8) -->
  <text x="50" y="265" font-size="12" text-anchor="end" fill="#111">0</text>
  <text x="50" y="235" font-size="12" text-anchor="end" fill="#111">1</text>
  <text x="50" y="205" font-size="12" text-anchor="end" fill="#111">2</text>
  <text x="50" y="175" font-size="12" text-anchor="end" fill="#111">3</text>
  <text x="50" y="145" font-size="12" text-anchor="end" fill="#111">4</text>
  <text x="50" y="115" font-size="12" text-anchor="end" fill="#111">5</text>
  <text x="50" y="85" font-size="12" text-anchor="end" fill="#111">6</text>
  <text x="50" y="55" font-size="12" text-anchor="end" fill="#111">7</text>
  <text x="50" y="25" font-size="12" text-anchor="end" fill="#111">8</text>

  <!-- Título do eixo Y rotacionado -->
  <text x="-140" y="22" font-size="13" font-style="italic" transform="rotate(-90)" text-anchor="middle" fill="#222">número de alunos</text>

  <!-- Barras (cinza com borda) -->
  <!-- Nota 1.0 (4 alunos -> altura 4 * 30 = 120, y = 140) -->
  <rect x="95" y="140" width="26" height="120" fill="#a0a0a0" stroke="#333" stroke-width="1" />
  <text x="108" y="278" font-size="12" text-anchor="middle" fill="#222">1,0</text>

  <!-- Nota 2.0 (6 alunos -> altura 6 * 30 = 180, y = 80) -->
  <rect x="165" y="80" width="26" height="180" fill="#a0a0a0" stroke="#333" stroke-width="1" />
  <text x="178" y="278" font-size="12" text-anchor="middle" fill="#222">2,0</text>

  <!-- Nota 3.0 (5 alunos -> altura 5 * 30 = 150, y = 110) -->
  <rect x="235" y="110" width="26" height="150" fill="#a0a0a0" stroke="#333" stroke-width="1" />
  <text x="248" y="278" font-size="12" text-anchor="middle" fill="#222">3,0</text>

  <!-- Nota 4.0 (7 alunos -> altura 7 * 30 = 210, y = 50) -->
  <rect x="305" y="50" width="26" height="210" fill="#a0a0a0" stroke="#333" stroke-width="1" />
  <text x="318" y="278" font-size="12" text-anchor="middle" fill="#222">4,0</text>

  <!-- Nota 5.0 (3 alunos -> altura 3 * 30 = 90, y = 170) -->
  <rect x="375" y="170" width="26" height="90" fill="#a0a0a0" stroke="#333" stroke-width="1" />
  <text x="388" y="278" font-size="12" text-anchor="middle" fill="#222">5,0</text>

  <!-- Rótulo do eixo X -->
  <text x="250" y="302" font-size="13" font-style="italic" text-anchor="middle" fill="#222">notas obtidas pelos alunos</text>
</svg>