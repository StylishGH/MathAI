<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 260" width="100%" height="100%" style="background-color: #ffffff; font-family: 'Times New Roman', serif;">
  <!-- Arestas ocultas (tracejadas) -->
  <line x1="80" y1="210" x2="160" y2="150" stroke="#777" stroke-width="1.5" stroke-dasharray="4,4" />
  <line x1="160" y1="150" x2="380" y2="150" stroke="#777" stroke-width="1.5" stroke-dasharray="4,4" />
  <line x1="160" y1="150" x2="160" y2="50" stroke="#777" stroke-width="1.5" stroke-dasharray="4,4" />

  <!-- Arestas visíveis -->
  <!-- Base inferior frontal / lateral -->
  <line x1="80" y1="210" x2="300" y2="210" stroke="#222" stroke-width="2" />
  <line x1="300" y1="210" x2="380" y2="150" stroke="#222" stroke-width="2" />

  <!-- Arestas verticais frontais / direita -->
  <line x1="80" y1="210" x2="80" y2="110" stroke="#222" stroke-width="2" />
  <line x1="300" y1="210" x2="300" y2="110" stroke="#222" stroke-width="2" />
  <line x1="380" y1="150" x2="380" y2="50" stroke="#222" stroke-width="2" />

  <!-- Face superior -->
  <line x1="80" y1="110" x2="300" y2="110" stroke="#222" stroke-width="2" />
  <line x1="300" y1="110" x2="380" y2="50" stroke="#222" stroke-width="2" />
  <line x1="380" y1="50" x2="160" y2="50" stroke="#222" stroke-width="2" />
  <line x1="160" y1="50" x2="80" y2="110" stroke="#222" stroke-width="2" />

  <!-- Rótulos dos vértices -->
  <text x="65" y="222" font-size="15" font-style="italic" fill="#111">A</text>
  <text x="305" y="222" font-size="15" font-style="italic" fill="#111">B</text>
  <text x="390" y="155" font-size="15" font-style="italic" fill="#111">F</text>
  <text x="145" y="152" font-size="15" font-style="italic" fill="#666">E</text>

  <text x="65" y="105" font-size="15" font-style="italic" fill="#111">D</text>
  <text x="305" y="105" font-size="15" font-style="italic" fill="#111">C</text>
  <text x="390" y="48" font-size="15" font-style="italic" fill="#111">G</text>
  <text x="145" y="45" font-size="15" font-style="italic" fill="#111">H</text>
</svg>