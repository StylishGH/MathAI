<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" width="100%" height="100%" style="background-color: #ffffff; font-family: 'Times New Roman', serif;">
  <!-- Triângulo ABC -->
  <polygon points="60,180 340,180 200,40" fill="none" stroke="#222" stroke-width="2" stroke-linejoin="round" />

  <!-- Vértices -->
  <text x="45" y="195" font-size="16" font-style="italic" fill="#111">A</text>
  <text x="345" y="195" font-size="16" font-style="italic" fill="#111">B</text>
  <text x="195" y="30" font-size="16" font-style="italic" fill="#111">C</text>

  <!-- Ângulo alpha em A -->
  <path d="M 90,180 A 30,30 0 0,0 78,160" fill="none" stroke="#444" stroke-width="1.2" />
  <text x="96" y="172" font-size="14" font-style="italic" fill="#222">&#945;</text>

  <!-- Ângulo beta em B -->
  <path d="M 310,180 A 30,30 0 0,1 322,160" fill="none" stroke="#444" stroke-width="1.2" />
  <text x="296" y="172" font-size="14" font-style="italic" fill="#222">&#946;</text>

  <!-- Distância c = a na base AB -->
  <text x="200" y="200" font-size="15" font-style="italic" text-anchor="middle" fill="#111">a</text>
</svg>